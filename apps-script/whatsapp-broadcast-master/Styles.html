<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e6e8ee;
    --green: #12b76a;
    --teal: #0d9488;
    --blue: #2563eb;
    --red: #dc2626;
    --amber: #d97706;
    --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
    --grad: linear-gradient(135deg, #12b76a 0%, #0d9488 52%, #2563eb 100%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; }
  .app {
    display: grid;
    grid-template-columns: 228px 1fr;
    min-height: 640px;
    height: 100%;
    background: var(--bg);
  }
  .nav {
    background: #0b1220;
    color: #e2e8f0;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .brand {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
  }
  .mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--grad);
    display: grid;
    place-items: center;
    color: white;
    font-weight: 800;
  }
  .brand b { display: block; font-size: 13px; color: white; }
  .brand span { display: block; font-size: 11px; color: #94a3b8; }
  .nav button {
    background: transparent;
    border: 0;
    color: #cbd5e1;
    text-align: left;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .nav button.active, .nav button:hover { background: rgba(255,255,255,.08); color: white; }
  .mode-pill {
    margin-top: auto;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 12px;
    background: rgba(255,255,255,.06);
  }
  .mode-pill.mock { color: #fdba74; }
  .mode-pill.live { color: #86efac; }
  .main { padding: 22px 24px 28px; overflow: auto; }
  .top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.03em; }
  .sub { color: var(--muted); margin-top: 4px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .kpi b { display: block; font-size: 22px; letter-spacing: -0.03em; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .btn {
    border: 0;
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
    background: #e2e8f0;
    color: var(--ink);
  }
  .btn.primary { background: var(--ink); color: white; }
  .btn.accent { background: var(--grad); color: white; }
  .btn.danger { background: #fee2e2; color: #991b1b; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field span { font-size: 12px; color: var(--muted); font-weight: 600; }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    background: white;
  }
  textarea { min-height: 70px; resize: vertical; }
  .badge {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    background: #e2e8f0;
  }
  .ok { background: #dcfce7; color: #166534; }
  .warn { background: #ffedd5; color: #9a3412; }
  .bad { background: #fee2e2; color: #991b1b; }
  .info { background: #dbeafe; color: #1d4ed8; }
  .progress {
    height: 12px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > div { height: 100%; background: var(--grad); }
  .map-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
  }
  .preview {
    white-space: pre-wrap;
    background: #0b1220;
    color: #e2e8f0;
    border-radius: 16px;
    padding: 16px;
    min-height: 120px;
  }
  .check { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .hidden { display: none !important; }
  .steps { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .steps div {
    padding: 6px 10px;
    border-radius: 999px;
    background: white;
    border: 1px solid var(--line);
    font-size: 12px;
  }
  .steps div.on { background: var(--ink); color: white; }
  .alert {
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .alert.warn { background: #fff7ed; color: #9a3412; }
  .alert.bad { background: #fef2f2; color: #991b1b; }
  .alert.ok { background: #f0fdf4; color: #166534; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .help h3 { margin-bottom: 6px; }
  .help p { color: var(--muted); margin-top: 0; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .grid, .grid-2 { grid-template-columns: 1fr 1fr; }
  }
</style>
